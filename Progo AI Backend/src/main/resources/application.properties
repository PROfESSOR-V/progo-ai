spring.application.name=backend
server.port=${PORT:8080}

# MongoDB - Use environment variable
spring.data.mongodb.uri=${MONGODB_URI}

# OpenAI
openai.api.key=${OPENAI_API_KEY}

# Pinecone
pinecone.api.key=${PINECONE_API_KEY}
pinecone.index=${PINECONE_INDEX:ragtest}
pinecone.index.host=${PINECONE_INDEX_HOST:}

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# RAG Pipeline paths
rag.python.path=${RAG_PYTHON_PATH:/usr/bin/python3}
rag.script.path=${RAG_SCRIPT_PATH:./main.py}
rag.data.dir=${RAG_DATA_DIR:./data}
